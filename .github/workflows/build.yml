name: Build OpenWrt for Orange Pi 3 LTS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OW_COMMIT: 58584c6f2829a7e5d77376ab68aae3dcc4a392d8
  OPENWRT_DIR: ${{ github.workspace }}/.work/openwrt
  LOG_DIR: ${{ github.workspace }}/_logs

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Clone pinned OpenWrt source
        run: |
          mkdir -p "$(dirname "$OPENWRT_DIR")"
          git clone --no-checkout https://github.com/openwrt/openwrt.git "$OPENWRT_DIR"
          git -C "$OPENWRT_DIR" fetch --depth 1 origin "$OW_COMMIT"
          git -C "$OPENWRT_DIR" checkout --detach "$OW_COMMIT"
          git -C "$OPENWRT_DIR" rev-parse HEAD

      - name: Cache OpenWrt source downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENWRT_DIR }}/dl
          key: openwrt-dl-${{ env.OW_COMMIT }}
          restore-keys: openwrt-dl-

      - name: Update and install LuCI package feeds
        run: |
          mkdir -p "$LOG_DIR"
          cd "$OPENWRT_DIR"
          ./scripts/feeds update packages luci > "$LOG_DIR/feeds-update.log" 2>&1 || { cat "$LOG_DIR/feeds-update.log"; exit 1; }
          ./scripts/feeds install -a -p packages > "$LOG_DIR/feeds-install-packages.log" 2>&1 || { cat "$LOG_DIR/feeds-install-packages.log"; exit 1; }
          ./scripts/feeds install -a -p luci > "$LOG_DIR/feeds-install-luci.log" 2>&1 || { cat "$LOG_DIR/feeds-install-luci.log"; exit 1; }
          sh scripts/prepare-argon.sh "$OPENWRT_DIR" > "$LOG_DIR/argon-sources.txt" 2>&1 || { cat "$LOG_DIR/argon-sources.txt"; exit 1; }
          cat "$LOG_DIR/argon-sources.txt"

      - name: Apply overlay and configure
        run: |
          mkdir -p "$LOG_DIR"
          sh scripts/apply-overlay.sh "$OPENWRT_DIR"
          cd "$OPENWRT_DIR"
          cat > .config <<'EOF'
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa53=y
          CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-3-lts=y
          CONFIG_PER_FEED_REPO=y
          CONFIG_FEED_luci=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          EOF
          make defconfig > "$LOG_DIR/defconfig.log" 2>&1 || { cat "$LOG_DIR/defconfig.log"; exit 1; }
          cp .config "$LOG_DIR/openwrt.config"
          grep -qx 'CONFIG_FEED_luci=y' .config || { echo 'LuCI package feed is not enabled'; exit 1; }

      - name: Download sources
        run: |
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" download > "$LOG_DIR/download.log" 2>&1 || { cat "$LOG_DIR/download.log"; exit 1; }

      - name: Build and install OpenWrt toolchain
        run: |
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" toolchain/install > "$LOG_DIR/toolchain.log" 2>&1 || { cat "$LOG_DIR/toolchain.log"; exit 1; }

      - name: Compile target kernel
        run: |
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" target/linux/compile > "$LOG_DIR/kernel.log" 2>&1 || { cat "$LOG_DIR/kernel.log"; exit 1; }

      - name: Compile UWE5622 driver package
        run: |
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" package/kernel/uwe5622/compile V=s > "$LOG_DIR/uwe5622.log" 2>&1 || { cat "$LOG_DIR/uwe5622.log"; exit 1; }

      - name: Build firmware image
        run: |
          cd "$OPENWRT_DIR"
          if ! make -j"$(nproc)" > "$LOG_DIR/build.log" 2>&1; then
            cat "$LOG_DIR/build.log"
            if grep -q 'ERROR: target/linux failed to build' "$LOG_DIR/build.log"; then
              df -h > "$LOG_DIR/disk-after-build-failure.txt"
              df -i >> "$LOG_DIR/disk-after-build-failure.txt"
              echo "Retrying target/linux/install serially with verbose output for diagnosis"
              if ! make -j1 V=s target/linux/install > "$LOG_DIR/target-linux-install.log" 2>&1; then
                cat "$LOG_DIR/target-linux-install.log"
                exit 1
              fi
              echo "Verbose target install passed; resuming full firmware build"
              make -j"$(nproc)" > "$LOG_DIR/build-retry.log" 2>&1 || { cat "$LOG_DIR/build-retry.log"; exit 1; }
            else
              exit 1
            fi
          fi
          image_dir=bin/targets/sunxi/cortexa53
          manifest="$image_dir/openwrt-sunxi-cortexa53-xunlong_orangepi-3-lts.manifest"
          test -s "$manifest" || { echo "Image manifest is missing: $manifest"; exit 1; }
          for package in \
            luci-base luci-mod-admin-full uhttpd uhttpd-mod-ubus \
            luci-theme-argon luci-app-argon-config \
            luci-i18n-argon-config-zh-cn luci-i18n-base-zh-cn \
            luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn; do
            grep -q "^${package} " "$manifest" || { echo "Expected web-admin package is missing: $package"; exit 1; }
          done
          find "$image_dir" -maxdepth 1 -type f -name '*xunlong_orangepi-3-lts*' -print > "$LOG_DIR/images.txt"
          grep -q '\.img\.gz$' "$LOG_DIR/images.txt" || { echo 'Orange Pi 3 LTS .img.gz image was not generated'; cat "$LOG_DIR/images.txt"; exit 1; }
          : > "$LOG_DIR/uwe5622-packages.txt"
          for package_dir in "$image_dir/packages" bin/packages; do
            if [ -d "$package_dir" ]; then
              find "$package_dir" -type f \( -name 'kmod-uwe5622*.ipk' -o -name 'uwe5622-firmware*.ipk' \) -print >> "$LOG_DIR/uwe5622-packages.txt"
            fi
          done
          grep -q 'kmod-uwe5622' "$LOG_DIR/uwe5622-packages.txt" || { echo 'kmod-uwe5622 package was not generated'; cat "$LOG_DIR/uwe5622-packages.txt"; exit 1; }
          grep -q 'uwe5622-firmware' "$LOG_DIR/uwe5622-packages.txt" || { echo 'uwe5622-firmware package was not generated'; cat "$LOG_DIR/uwe5622-packages.txt"; exit 1; }

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-opi3lts
          path: |
            ${{ env.OPENWRT_DIR }}/bin/targets/sunxi/cortexa53/*.img.gz
            ${{ env.OPENWRT_DIR }}/bin/targets/sunxi/cortexa53/*.manifest
            ${{ env.OPENWRT_DIR }}/bin/targets/sunxi/cortexa53/sha256sums
            ${{ env.OPENWRT_DIR }}/bin/targets/sunxi/cortexa53/packages/kmod-uwe5622*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/base/uwe5622-firmware*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/base/luci-theme-argon*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/base/luci-app-argon-config*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/base/luci-i18n-argon-config-zh-cn*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/luci/luci-i18n-base-zh-cn*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/luci/luci-i18n-firewall-zh-cn*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/luci/luci-i18n-package-manager-zh-cn*.ipk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: ${{ env.LOG_DIR }}/
          if-no-files-found: warn
