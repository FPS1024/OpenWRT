name: Build OpenWrt for Orange Pi 3 LTS

on:
  workflow_dispatch:
    inputs:
      include_dev_tools:
        description: 'Include target-side git/make/gcc/binutils (slower and larger image)'
        required: true
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read

env:
  OW_COMMIT: 58584c6f2829a7e5d77376ab68aae3dcc4a392d8
  OPENWRT_DIR: ${{ github.workspace }}/.work/openwrt
  LOG_DIR: ${{ github.workspace }}/_logs

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      INCLUDE_DEV_TOOLS: ${{ inputs.include_dev_tools && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Clone pinned OpenWrt source
        run: |
          mkdir -p "$(dirname "$OPENWRT_DIR")"
          git clone --no-checkout https://github.com/openwrt/openwrt.git "$OPENWRT_DIR"
          git -C "$OPENWRT_DIR" fetch --depth 1 origin "$OW_COMMIT"
          git -C "$OPENWRT_DIR" checkout --detach "$OW_COMMIT"
          git -C "$OPENWRT_DIR" rev-parse HEAD

      - name: Cache OpenWrt source downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENWRT_DIR }}/dl
          key: openwrt-dl-${{ env.OW_COMMIT }}
          restore-keys: openwrt-dl-

      - name: Update and install LuCI package feeds
        run: |
          mkdir -p "$LOG_DIR"
          cd "$OPENWRT_DIR"
          ./scripts/feeds update packages luci > "$LOG_DIR/feeds-update.log" 2>&1 || { cat "$LOG_DIR/feeds-update.log"; exit 1; }
          ./scripts/feeds install -a -p packages > "$LOG_DIR/feeds-install-packages.log" 2>&1 || { cat "$LOG_DIR/feeds-install-packages.log"; exit 1; }
          ./scripts/feeds install -a -p luci > "$LOG_DIR/feeds-install-luci.log" 2>&1 || { cat "$LOG_DIR/feeds-install-luci.log"; exit 1; }
          sh "$GITHUB_WORKSPACE/scripts/prepare-argon.sh" "$OPENWRT_DIR" > "$LOG_DIR/argon-sources.txt" 2>&1 || { cat "$LOG_DIR/argon-sources.txt"; exit 1; }
          cat "$LOG_DIR/argon-sources.txt"

      - name: Apply overlay and configure
        run: |
          mkdir -p "$LOG_DIR"
          sh scripts/apply-overlay.sh "$OPENWRT_DIR"
          cd "$OPENWRT_DIR"
          rm -rf package/luci-app-openclash-prebuilt
          rm -f dl/luci-app-openclash-latest.ipk
          if [ -d bin/packages ]; then
            find bin/packages -type f -name 'luci-app-openclash*.ipk' -delete
          fi
          cat > .config <<'EOF'
          CONFIG_TARGET_sunxi=y
          CONFIG_TARGET_sunxi_cortexa53=y
          CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-3-lts=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=104
          CONFIG_DEVEL=y
          CONFIG_PER_FEED_REPO=y
          CONFIG_FEED_packages=y
          CONFIG_FEED_luci=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y
          # dnsmasq and dnsmasq-full install the same files; keep only full.
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_libnettle=y
          CONFIG_PACKAGE_libnetfilter-conntrack=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_sfdisk=y
          CONFIG_PACKAGE_partx-utils=y
          CONFIG_PACKAGE_losetup=y
          CONFIG_PACKAGE_resize2fs=y
          EOF
          if [ "$INCLUDE_DEV_TOOLS" = 1 ]; then
            cat >> .config <<'EOF'
          # Optional target-side development tools. They add a large amount of
          # compilation time and image size, so production AP images omit them.
          CONFIG_PACKAGE_git=y
          CONFIG_PACKAGE_git-http=y
          CONFIG_PACKAGE_make=y
          CONFIG_PACKAGE_gcc=y
          CONFIG_PACKAGE_binutils=y
          EOF
          else
            cat >> .config <<'EOF'
          # CONFIG_PACKAGE_git is not set
          # CONFIG_PACKAGE_git-http is not set
          # CONFIG_PACKAGE_make is not set
          # CONFIG_PACKAGE_gcc is not set
          # CONFIG_PACKAGE_binutils is not set
          # CONFIG_PACKAGE_ar is not set
          # CONFIG_PACKAGE_objdump is not set
          # CONFIG_PACKAGE_libbfd is not set
          # CONFIG_PACKAGE_libctf is not set
          # CONFIG_PACKAGE_libopcodes is not set
          EOF
          fi
          printf '%s\n' '# CONFIG_PACKAGE_luci-app-openclash is not set' >> .config
          make defconfig > "$LOG_DIR/defconfig.log" 2>&1 || { cat "$LOG_DIR/defconfig.log"; exit 1; }
          cp .config "$LOG_DIR/openwrt.config"
          grep -qx 'CONFIG_TARGET_ROOTFS_PARTSIZE=104' .config || { echo 'Unexpected rootfs partition size: keep the factory image small (104 MiB)'; exit 1; }
          grep -qx 'CONFIG_FEED_packages=y' .config || { echo 'OpenWrt packages feed is not enabled'; exit 1; }
          grep -qx 'CONFIG_FEED_luci=y' .config || { echo 'LuCI package feed is not enabled'; exit 1; }
          grep -qx 'CONFIG_LUCI_LANG_zh_Hans=y' .config || { echo 'LuCI Simplified Chinese translations are not enabled'; exit 1; }
          grep -qx 'CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y' .config || { echo 'Argon Config Chinese translation was not selected by defconfig'; exit 1; }
          if grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config; then
            echo 'OpenClash app must not be selected for the factory image'
            exit 1
          fi
          grep -qx 'CONFIG_PACKAGE_sfdisk=y' .config || { echo 'sfdisk was not selected by defconfig'; exit 1; }
          for package in \
            luci-base luci-mod-admin-full luci-compat uhttpd uhttpd-mod-ubus \
            luci-theme-argon luci-app-argon-config \
            luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn \
            luci-i18n-package-manager-zh-cn; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config || { echo "Expected web-admin package was not selected by defconfig: $package"; exit 1; }
          done
          if [ "$INCLUDE_DEV_TOOLS" = 1 ]; then
            for package in git git-http make gcc binutils; do
              grep -qx "CONFIG_PACKAGE_${package}=y" .config || { echo "Requested development package was not selected by defconfig: $package"; exit 1; }
            done
          fi

      - name: Download sources
        run: |
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" download > "$LOG_DIR/download.log" 2>&1 || { cat "$LOG_DIR/download.log"; exit 1; }

      - name: Build and install OpenWrt toolchain
        run: |
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" toolchain/install > "$LOG_DIR/toolchain.log" 2>&1 || { cat "$LOG_DIR/toolchain.log"; exit 1; }

      - name: Compile target kernel
        run: |
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" target/linux/compile > "$LOG_DIR/kernel.log" 2>&1 || { cat "$LOG_DIR/kernel.log"; exit 1; }

      - name: Compile UWE5622 driver package
        run: |
          cd "$OPENWRT_DIR"
          make -j"$(nproc)" package/kernel/uwe5622/compile V=s > "$LOG_DIR/uwe5622.log" 2>&1 || { cat "$LOG_DIR/uwe5622.log"; exit 1; }

      - name: Build packages and firmware image
        run: |
          cd "$OPENWRT_DIR"
          JOBS="$(nproc)"
          stage() {
            name="$1"
            shift
            log="$LOG_DIR/${name}.log"
            echo "=== START ${name} ($(date -u +%FT%TZ)) ==="
            set +e
            "$@" 2>&1 | tee "$log"
            status="${PIPESTATUS[0]}"
            set -e
            if [ "$status" -ne 0 ]; then
              echo "=== FAILED ${name} ($(date -u +%FT%TZ)) ==="
              return "$status"
            fi
            echo "=== DONE ${name} ($(date -u +%FT%TZ)) ==="
          }
          fakeroot_bin="$OPENWRT_DIR/staging_dir/host/bin/fakeroot"
          if [ -x "$fakeroot_bin" ] && ! "$fakeroot_bin" true >/dev/null 2>&1 && [ -x /usr/bin/fakeroot ]; then
            cp -p "$fakeroot_bin" "$fakeroot_bin.openwrt" 2>/dev/null || true
            cat > "$fakeroot_bin" <<'EOF'
          #!/bin/sh
          exec /usr/bin/fakeroot "$@"
          EOF
            chmod 0755 "$fakeroot_bin"
            echo 'Using system fakeroot because the OpenWrt host helper failed its socket probe'
          fi
          stage package-compile make -j"$JOBS" package/compile || exit 1
          stage package-install make -j"$JOBS" package/install || exit 1
          # Image generation is deliberately serial and verbose. This is the
          # short final stage and its log now contains the real failing command.
          stage target-install make -j1 V=s target/install || exit 1
          storage_init="$(find "$OPENWRT_DIR/build_dir" -type f -path '*/root-sunxi/etc/init.d/opi3lts-expand-storage' -print -quit)"
          test -n "$storage_init" || { echo 'SD-card expansion init script is missing from the image root'; exit 1; }
          storage_root="${storage_init%/etc/init.d/opi3lts-expand-storage}"
          test -f "$storage_root/lib/preinit/79_opi3lts_expand_storage" || {
            echo 'SD-card expansion preinit hook is missing from the image root'
            exit 1
          }
          test -L "$storage_root/etc/rc.d/S99opi3lts-expand-storage" || {
            echo 'SD-card expansion init script is not enabled at S99'
            exit 1
          }
          stage package-index make -j"$JOBS" package/index json_overview_image_info checksum || exit 1
          image_dir=bin/targets/sunxi/cortexa53
          manifest="$image_dir/openwrt-sunxi-cortexa53-xunlong_orangepi-3-lts.manifest"
          test -s "$manifest" || { echo "Image manifest is missing: $manifest"; exit 1; }
          for package in \
            luci-base luci-mod-admin-full uhttpd uhttpd-mod-ubus \
            dnsmasq-full libnettle8 libnetfilter-conntrack3 \
            bash curl ca-bundle ip-full ruby ruby-yaml unzip \
            sfdisk partx-utils losetup resize2fs \
            luci-theme-argon luci-app-argon-config \
            luci-i18n-argon-config-zh-cn luci-i18n-base-zh-cn \
            luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn; do
            grep -q "^${package} " "$manifest" || { echo "Expected web-admin package is missing: $package"; exit 1; }
          done
          if [ "$INCLUDE_DEV_TOOLS" = 1 ]; then
            for package in git git-http make gcc binutils; do
              grep -q "^${package} " "$manifest" || { echo "Requested development package is missing: $package"; exit 1; }
            done
          fi
          if grep -q '^luci-app-openclash ' "$manifest"; then
            echo 'Unexpected OpenClash app package found in image manifest'
            exit 1
          fi
          echo 'OpenClash app is not bundled; its runtime dependencies are included'
          find "$image_dir" -maxdepth 1 -type f -name '*xunlong_orangepi-3-lts*' -print > "$LOG_DIR/images.txt"
          grep -q '\.img\.gz$' "$LOG_DIR/images.txt" || { echo 'Orange Pi 3 LTS .img.gz image was not generated'; cat "$LOG_DIR/images.txt"; exit 1; }
          squashfs_image="$image_dir/openwrt-sunxi-cortexa53-xunlong_orangepi-3-lts-squashfs-sdcard.img.gz"
          test -s "$squashfs_image" || { echo "SquashFS image is missing: $squashfs_image"; exit 1; }
          squashfs_bytes="$(wc -c < "$squashfs_image")"
          [ "$squashfs_bytes" -lt 268435456 ] || { echo "SquashFS image is unexpectedly large (${squashfs_bytes} bytes); refusing an artificial multi-gigabyte image"; exit 1; }
          for package in kmod-tun kmod-inet-diag kmod-nft-tproxy kmod-nf-conntrack-netlink; do
            grep -q "^${package} " "$manifest" || { echo "Kernel-matched ${package} package is missing from the image"; exit 1; }
          done
          : > "$LOG_DIR/uwe5622-packages.txt"
          for package_dir in "$image_dir/packages" bin/packages; do
            if [ -d "$package_dir" ]; then
              find "$package_dir" -type f \( -name 'kmod-uwe5622*.ipk' -o -name 'uwe5622-firmware*.ipk' \) -print >> "$LOG_DIR/uwe5622-packages.txt"
            fi
          done
          grep -q 'kmod-uwe5622' "$LOG_DIR/uwe5622-packages.txt" || { echo 'kmod-uwe5622 package was not generated'; cat "$LOG_DIR/uwe5622-packages.txt"; exit 1; }
          grep -q 'uwe5622-firmware' "$LOG_DIR/uwe5622-packages.txt" || { echo 'uwe5622-firmware package was not generated'; cat "$LOG_DIR/uwe5622-packages.txt"; exit 1; }

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-opi3lts
          path: |
            ${{ env.OPENWRT_DIR }}/bin/targets/sunxi/cortexa53/*.img.gz
            ${{ env.OPENWRT_DIR }}/bin/targets/sunxi/cortexa53/*.manifest
            ${{ env.OPENWRT_DIR }}/bin/targets/sunxi/cortexa53/sha256sums
            ${{ env.OPENWRT_DIR }}/bin/targets/sunxi/cortexa53/packages/kmod-uwe5622*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/base/uwe5622-firmware*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/base/luci-theme-argon*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/base/luci-app-argon-config*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/base/luci-i18n-argon-config-zh-cn*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/luci/luci-i18n-base-zh-cn*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/luci/luci-i18n-firewall-zh-cn*.ipk
            ${{ env.OPENWRT_DIR }}/bin/packages/*/luci/luci-i18n-package-manager-zh-cn*.ipk
          # The image includes OpenClash runtime dependencies, not the app.
          if-no-files-found: warn

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: ${{ env.LOG_DIR }}/
          if-no-files-found: warn

  notify:
    name: Email build result
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Check SMTP secrets
        id: smtp
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SMTP_USERNAME/SMTP_PASSWORD are not configured; email notification skipped.'
          fi

      - name: Send build result email
        if: steps.smtp.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp-mail.outlook.com' }}
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '[OpenWrt Orange Pi 3 LTS] build ${{ needs.build.result }}'
          to: ceaser.k.w@outlook.com
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            OpenWrt Orange Pi 3 LTS GitHub Actions build result: ${{ needs.build.result }}

            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The workflow's firmware and diagnostics artifacts are available on the run page.
